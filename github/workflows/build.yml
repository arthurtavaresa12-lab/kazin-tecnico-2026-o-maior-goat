name: Kazin Técnico 2026 - Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK Android 36
        run: |
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Localizar projeto Android
        id: android
        shell: bash
        run: |
          PROJECT_DIR="$(find . -name settings.gradle -type f -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERRO: projeto Android não encontrado."
            echo "O arquivo settings.gradle não foi encontrado."
            exit 1
          fi

          echo "Projeto encontrado em: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Configurar Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Limpar e compilar APK
        working-directory: ${{ steps.android.outputs.dir }}
        run: |
          gradle clean assembleDebug --no-daemon --stacktrace

      - name: Compilar AAB
        working-directory: ${{ steps.android.outputs.dir }}
        run: |
          gradle bundleDebug --no-daemon --stacktrace

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Kazin-Tecnico-V30-APK
          path: ${{ steps.android.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Disponibilizar AAB
        uses: actions/upload-artifact@v4
        with:
          name: Kazin-Tecnico-V30-AAB
          path: ${{ steps.android.outputs.dir }}/app/build/outputs/bundle/debug/*.aab
          if-no-files-found: error
