name: Kazin Técnico 2026 - Android

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 36
        uses: android-actions/setup-android@v3

      - name: Instalar SDK
        run: sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Localizar projeto Android
        id: android
        shell: bash
        run: |
          PROJECT_DIR="$(find . -name settings.gradle -type f -print -quit | xargs -r dirname)"
          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "Projeto Android não encontrado: settings.gradle ausente."
            exit 1
          fi
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Projeto: $PROJECT_DIR"

      - name: Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Validar e compilar APK + AAB
        working-directory: ${{ steps.android.outputs.dir }}
        run: |
          gradle --version
          gradle clean assembleDebug bundleDebug --no-daemon --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Kazin-Tecnico-V30-APK
          path: ${{ steps.android.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publicar AAB
        uses: actions/upload-artifact@v4
        with:
          name: Kazin-Tecnico-V30-AAB
          path: ${{ steps.android.outputs.dir }}/app/build/outputs/bundle/debug/*.aab
          if-no-files-found: error
